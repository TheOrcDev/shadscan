packages:
  - packages/*

overrides:
  brace-expansion: 5.0.9
  js-yaml@<4.3.1: 4.3.1
  nanoid: 3.3.18
  next>postcss: 8.5.26
  sharp: 0.35.4

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

# pnpm 11 enforces a 24h supply-chain quarantine by default; state it so local
# installs verify the same policy CI and Vercel do.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @shadcn/lint 0.1.0 is its first and only release (2026-09-14). Remove this
  # exemption after 2026-09-15; the policy then covers it like everything else.
  - "@shadcn/lint"
