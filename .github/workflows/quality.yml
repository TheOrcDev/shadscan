name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm cli:build
      - name: Check formatting and lint
        run: pnpm check
      - name: Check generated rule catalog
        run: pnpm docs:check
      - name: Audit production dependencies
        run: pnpm audit:dependencies
      - name: Typecheck CLI
        run: pnpm --filter ./packages/cli typecheck
      - name: Typecheck site and API
        run: pnpm ci:typecheck
      - name: Test CLI
        run: pnpm cli:test
      - name: Test hosted API
        run: pnpm ci:test-api
      - name: Test web scanner
        run: pnpm ci:test-web
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test web scanner in Chromium
        run: pnpm ci:test-e2e
      - name: Enforce the dogfood score
        run: pnpm ci:audit-self
      - name: Build production site
        run: pnpm ci:build-site
      - name: Verify production traces
        run: pnpm verify:trace

  packed-cli:
    name: Packed CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 18
          - 26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          standalone: true
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @shadscan/cli...
      - name: Build CLI
        run: pnpm cli:build
      - name: Install Chromium for packed overflow smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 18
        shell: bash
        run: pnpm --filter @shadscan/cli exec playwright-core install --with-deps chromium
      - name: Smoke test packed CLI
        run: pnpm cli:smoke:built
      - name: Smoke test packed overflow mode
        if: matrix.os == 'ubuntu-latest' && matrix.node == 18
        shell: bash
        run: |
          browser_executable="$(node --input-type=module -e 'import { createRequire } from "node:module"; const require = createRequire(new URL("./packages/cli/package.json", import.meta.url)); const { chromium } = require("playwright-core"); process.stdout.write(chromium.executablePath())')"
          node packages/cli/scripts/smoke-package.mjs --browser-executable "$browser_executable"
