name: Publish Shadscan

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-shadscan-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  stage-package:
    name: Verify and stage npm package
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.16.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm cli:build
      - name: Verify release metadata
        run: pnpm cli:release:check -- --tag "$NPM_DIST_TAG" --git-tag "$RELEASE_TAG"
      - name: Check formatting and lint
        run: pnpm check
      - name: Check generated rule catalog
        run: pnpm docs:check
      - name: Typecheck CLI
        run: pnpm --filter ./packages/cli typecheck
      - name: Typecheck site and API
        run: pnpm typecheck
      - name: Test CLI
        run: pnpm cli:test
      - name: Test hosted API
        run: pnpm test:api
      - name: Test web scanner
        run: pnpm test:web
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test web scanner in Chromium
        run: pnpm test:e2e
      - name: Audit production dependencies
        run: pnpm audit:dependencies
      - name: Enforce the dogfood score
        run: pnpm audit:self
      - name: Build production site
        run: pnpm build
      - name: Smoke test packed npx command
        run: pnpm cli:smoke
      - name: Stage package for npm approval
        working-directory: packages/cli
        run: npm stage publish --tag "$NPM_DIST_TAG"
